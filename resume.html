<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume – Grace Jensen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <style>
      .resume-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .resume-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1080px;
        margin: 0 auto;
        padding: 16px 24px;
      }
      .resume-nav a {
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
      }
      .resume-nav a:hover { color: var(--text); }

      .resume-header {
        text-align: center;
        padding: 40px 24px 24px;
      }
      .resume-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .resume-header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .resume-frame-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 0 24px 48px;
      }
      .resume-frame {
        width: 100%;
        max-width: 820px;
        min-height: 70vh;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <div class="resume-page">
      <nav class="resume-nav">
        <a href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Home
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle color theme" id="themeBtn"></button>
      </nav>

      <div class="resume-header">
        <h1>Resume</h1>
        <p>A snapshot of my experience and skills.</p>
      </div>

      <div class="resume-frame-wrapper">
        <iframe
          class="resume-frame"
          src="https://drive.google.com/file/d/1vXvKcARZ_nqLBGyMblcGq2NXpfMPgF4K/view?usp=sharing"
          title="Grace Jensen Resume"
        ></iframe>
      </div>
    </div>

    <script>
      (function() {
        var theme = localStorage.getItem('theme') ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        renderBtn(theme);
      })();

      function renderBtn(theme) {
        var btn = document.getElementById('themeBtn');
        btn.innerHTML = theme === 'dark'
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }

      function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        renderBtn(next);
      }
    </script>
  </body>
</html>
