<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Grace Jensen – Software Engineer in Seattle · Building tech for climate &amp; social justice · Mountaineer, climber, runner">
    <meta name="author" content="Grace Jensen">
    <link rel="icon" href="favicon.ico">

    <title>Grace Jensen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">

      const SunIcon = () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      );

      const MoonIcon = () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      );

      const LinkedInIcon = () => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      );

      const StravaIcon = () => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
        </svg>
      );

      const ArrowIcon = () => (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      );

      const ExternalIcon = () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      );

      const LinkCard = ({ icon, title, description, href, label }) => (
        <a href={href} target="_blank" rel="noopener noreferrer" className="link-card">
          <div className="link-card-icon">{icon}</div>
          <div className="link-card-content">
            <h3>{title}</h3>
            <p>{description}</p>
          </div>
          <div className="link-card-arrow">
            <ExternalIcon />
          </div>
        </a>
      );

      const App = () => {
        const getInitialTheme = () =>
          localStorage.getItem('theme') ||
          (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        const [theme, setTheme] = React.useState(getInitialTheme());
        const [scrolled, setScrolled] = React.useState(false);

        React.useEffect(() => {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
        }, [theme]);

        React.useEffect(() => {
          const onScroll = () => setScrolled(window.scrollY > 20);
          window.addEventListener('scroll', onScroll, { passive: true });
          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        return (
          <div className="page">
            <nav className={`nav${scrolled ? ' nav--scrolled' : ''}`}>
              <div className="nav-inner">
                <a href="#" className="nav-brand">GJ</a>
                <div className="nav-links">
                  <a href="#about" className="nav-link">About</a>
                  <a href="#connect" className="nav-link">Connect</a>
                  <a href="resume.html" className="nav-link">Resume</a>
                  <button
                    className="theme-toggle"
                    onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                    aria-label="Toggle color theme"
                  >
                    {theme === 'dark' ? <SunIcon /> : <MoonIcon />}
                  </button>
                </div>
              </div>
            </nav>

            <header className="hero">
              <div className="hero-bg-glow" />
              <div className="container hero-inner">
                <div className="hero-text">
                  <p className="hero-greeting">Hi there, I'm</p>
                  <h1 className="hero-name">Grace Jensen</h1>
                  <p className="hero-role">Software Engineer <span className="hero-sep">/</span> Seattle, WA</p>
                  <p className="hero-bio">
                    I love applying technology to climate and social justice — whether
                    that's building tools that drive real-world impact or crafting
                    polished full-stack experiences. When I'm not coding, you'll find
                    me mountaineering, climbing, or running trails across the Pacific Northwest.
                  </p>
                  <div className="hero-actions">
                    <a href="resume.html" className="btn btn-primary">
                      View Resume <ArrowIcon />
                    </a>
                    <a href="#connect" className="btn btn-ghost">
                      Get in Touch
                    </a>
                  </div>
                </div>
                <div className="hero-image-wrapper">
                  <div className="hero-image-ring">
                    <img
                      className="hero-image"
                      src="tolmiepeak.jpg"
                      alt="Grace Jensen at Tolmie Peak"
                    />
                  </div>
                </div>
              </div>
            </header>

            <section id="about" className="section">
              <div className="container">
                <h2 className="section-title">About Me</h2>
                <div className="about-grid">
                  <div className="about-card">
                    <div className="about-card-icon">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    </div>
                    <h3>Tech for Good</h3>
                    <p>I'm driven by applying technology to climate and social justice — building software that creates tangible, positive change in the world.</p>
                  </div>
                  <div className="about-card">
                    <div className="about-card-icon">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <h3>Community Advocate</h3>
                    <p>I've worked to increase tech access and literacy with returning citizens — helping people coming out of the justice system build new futures through technology.</p>
                  </div>
                  <div className="about-card">
                    <div className="about-card-icon">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2L8 8l-4-2-2 4 4 2v6l-4 2 2 4 4-2 6 6 6-6 4 2 2-4-4-2V12l4-2-2-4-4 2-6-6z"/><circle cx="12" cy="14" r="3"/></svg>
                    </div>
                    <h3>Mountaineer &amp; Athlete</h3>
                    <p>Away from the keyboard, I'm an avid mountaineer, rock climber, and trail runner — always chasing the next summit or finish line in the Pacific Northwest and beyond.</p>
                  </div>
                </div>
              </div>
            </section>

            <section id="connect" className="section">
              <div className="container">
                <h2 className="section-title">Let's Connect</h2>
                <p className="section-subtitle">I'm always open to new connections and conversations.</p>
                <div className="links-grid">
                  <LinkCard
                    icon={<LinkedInIcon />}
                    title="LinkedIn"
                    description="Let's expand our professional networks."
                    href="https://www.linkedin.com/in/hannah-grace-jensen-649838a4/"
                  />
                  <LinkCard
                    icon={<StravaIcon />}
                    title="Strava"
                    description="Follow my mountaineering, climbing, and running adventures."
                    href="https://www.strava.com/athletes/57961316"
                  />
                </div>
              </div>
            </section>

            <footer className="footer">
              <div className="container footer-inner">
                <p>&copy; {new Date().getFullYear()} Grace Jensen</p>
              </div>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
